version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dealscout
      POSTGRES_PASSWORD: dealscout
      POSTGRES_DB: dealscout
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./api
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes: [./api:/app/api]

  worker-scrape:
    build: ./api
    command: celery -A api.workers.scraper worker -Q scrape_queue -c 8 --loglevel=info
    env_file: .env
    depends_on: [postgres, redis]

  worker-extract:
    build: ./api
    command: celery -A api.workers.extract worker -Q extract_queue -c 4 --loglevel=info
    env_file: .env
    depends_on: [postgres, redis]

  flower:
    image: mher/flower
    command: celery flower --broker=$REDIS_URL
    env_file: .env
    ports: ["5555:5555"]
    depends_on: [redis]

volumes:
  pgdata:
