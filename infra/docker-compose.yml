services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dealscout
      POSTGRES_PASSWORD: dealscout
      POSTGRES_DB: dealscout
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: always

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: always

  api:
    build: ../api
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dealscout:dealscout@postgres:5432/dealscout
      REDIS_URL: redis://redis:6379
      TOR_PROXY_URL: socks5://tor:9150
    ports: ["8000:8000"]
    depends_on: [postgres, redis, tor]
    restart: always

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_WS_URL: ws://api:8000
      NODE_ENV: development
    depends_on: [api]
    restart: always

  worker-scrape:
    build: ../api
    command: celery -A api.workers.scraper worker -Q scrape_queue -c 8 --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dealscout:dealscout@postgres:5432/dealscout
      REDIS_URL: redis://redis:6379
      TOR_PROXY_URL: socks5://tor:9150
    depends_on: [postgres, redis, tor]
    restart: always

  worker-extract:
    build: ../api
    command: celery -A api.workers.extract worker -Q extract_queue -c 4 --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dealscout:dealscout@postgres:5432/dealscout
      REDIS_URL: redis://redis:6379
      TOR_PROXY_URL: socks5://tor:9150
    depends_on: [postgres, redis, tor]
    restart: always

  worker-beat:
    build: ../api
    command: celery -A api.workers.schedule beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dealscout:dealscout@postgres:5432/dealscout
      REDIS_URL: redis://redis:6379
      TOR_PROXY_URL: socks5://tor:9150
    depends_on: [postgres, redis, worker-scrape]
    restart: always

  flower:
    image: mher/flower
    command: celery flower --broker=redis://redis:6379
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["5555:5555"]
    depends_on: [redis]
    restart: always

  tor:
    image: peterdavehello/tor-socks-proxy:latest
    ports:
      - "9050:9150"
    restart: always

volumes:
  pgdata:
